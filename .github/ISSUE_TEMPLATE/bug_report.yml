name: Bug report
description: Share a MeleePad diagnostic report and the smallest useful visual evidence
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        MeleePad can fill most of this form: choose **••• → Report a Problem… → Create Diagnostic & Continue…**, review or save the diagnostic, then choose **Open GitHub**.

        Attach `On My iPhone/iPad → MeleePad → Diagnostics → Latest-MeleePad-Diagnostic.log`. If the problem is visual, also attach a screenshot or short video. Never upload game images, extracted assets, generated modules, saves, signing material, or an entire device container.
  - type: input
    id: report-id
    attributes:
      label: Report ID
      placeholder: SB-1234ABCD
  - type: input
    id: revision
    attributes:
      label: MeleePad revision
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [iPhone, iPad, iOS Simulator, macOS]
    validations:
      required: true
  - type: input
    id: performance-profile
    attributes:
      label: Performance profile
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: What went wrong?
    validations:
      required: true
  - type: input
    id: context
    attributes:
      label: Area and what you were doing
  - type: input
    id: frequency
    attributes:
      label: How often did it happen?
  - type: upload
    id: diagnostic-report
    attributes:
      label: MeleePad diagnostic report
      accept: ".log,.txt"
  - type: upload
    id: visual-evidence
    attributes:
      label: Screenshot or short video
      accept: ".png,.jpg,.jpeg,.webp,.mov,.mp4"
