name: Source checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: source-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-checks:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install source-check dependency
        run: brew install ripgrep
      - name: Record toolchain
        run: |
          xcodebuild -version
          clang --version
          python3 --version
      - name: Check out pinned runtime sources
        run: bash scripts/bootstrap-dependencies.sh --sources-only
      - name: Run source and dependency regression checks
        run: bash scripts/check-repository.sh
      - name: Verify tests left dependency sources unchanged
        run: python3 scripts/dependency-lock.py
  ios-build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: brew install cmake ninja ripgrep
      - name: Record toolchain
        run: |
          xcodebuild -version
          clang --version
      - name: Check out pinned Apple build sources
        run: bash scripts/bootstrap-dependencies.sh
      - name: Build the iOS runtime and app without private game inputs
        env:
          MELEEPAD_CI: "1"
        run: |
          bash scripts/ios-build-core-device.sh --core-only
          rustup toolchain install 1.88.0 --profile minimal
          rustup target add --toolchain 1.88.0 aarch64-apple-ios
          python3 scripts/build-slippi-dependencies.py
          bash scripts/ios-provision.sh device
          xcodebuild -project MeleePad.xcodeproj -scheme MeleePad -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build-ci CODE_SIGNING_ALLOWED=NO build
      - name: Verify build left dependency sources unchanged
        run: python3 scripts/dependency-lock.py
